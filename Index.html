<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width, initial-scale=1"><?!= include('Styles'); ?></head>
<body><main class="shell"><header><div><p class="eyebrow">HR SELF SERVICE</p><h1>Portal Cuti</h1></div><button id="refresh" class="secondary">Muat ulang</button></header><div id="notice" role="alert"></div><section id="loading">Memuat data Anda…</section><div id="app" hidden>
<section class="profile"><div><span>Halo,</span><h2 id="name"></h2><p id="meta"></p></div><div class="balance"><span>Sisa cuti tahunan</span><strong id="balance"></strong><small>hari kerja</small></div></section>
<nav><button data-tab="request" class="active">Ajukan cuti</button><button data-tab="history">Cuti saya</button><button id="adminTab" data-tab="admin" hidden>HRGA</button></nav>
<section id="request" class="tab"><h2>Pengajuan cuti</h2><form id="leaveForm"><label>Jenis cuti<select name="leaveType" required><option>Cuti Tahunan</option><option>Cuti Sakit</option><option>Cuti Khusus</option></select></label><div class="grid"><label>Tanggal mulai<input name="startDate" type="date" required></label><label>Tanggal selesai<input name="endDate" type="date" required></label></div><label>Alasan<textarea name="reason" required maxlength="500"></textarea></label><button type="submit">Kirim pengajuan</button></form></section>
<section id="history" class="tab" hidden><h2>Status cuti saya</h2><div id="myRequests"></div></section>
<section id="admin" class="tab" hidden><h2>Administrasi HRGA</h2><div class="admin-grid"><form id="employeeForm"><h3>Tambah / perbarui karyawan</h3><label>Email<input name="email" type="email" required></label><label>Nama<input name="name" required></label><label>Departemen<input name="department" required></label><label>Role<input name="role" required></label><label>Saldo cuti<input name="balance" type="number" min="0" required></label><label class="check"><input name="active" type="checkbox" checked> Akun aktif</label><button>Simpan karyawan</button></form><div><h3>Semua pengajuan</h3><div id="allRequests"></div></div></div></section>
</div></main><?!= include('Scripts'); ?></body></html>
